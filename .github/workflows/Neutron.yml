name: Build neutron clang Kernel (beryllium)
run-name: ${{ inputs.input-run-name }}

on:
  workflow_dispatch:
    inputs:
      input-run-name:
        description: 'Run name (for internal use, optional)'
        required: false
        default: 'Manual Run'
      variant:
        description: 'Touch firmware / DTS variant'
        required: true
        type: choice
        options:
          - all
          - 9.1.24-SE
          - 9.1.24-NSE
          - 10.3.7-SE
          - 10.3.7-NSE
      ksu:
        description: 'xxKernelSU / fork )?'
        required: false
        type: choice
        options:
          - Include
          - Exclude
          - Both
        default: Include
      defconfig:
        description: 'Defconfig (pisahkan dengan koma untuk build lebih dari satu)'
        required: false
        default: 'nogravity_defconfig'
      jobs:
        description: 'Parallel jobs'
        required: false
        default: '24'

jobs:
  matrix-setup:
    runs-on: ubuntu-22.04
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
      ksu_check: ${{ steps.set-matrix.outputs.ksu_check }}
      defconfigs: ${{ steps.set-matrix.outputs.defconfigs }}
    steps:
      - name: Set matrix variables
        id: set-matrix
        run: |
          if [ "${{ inputs.variant }}" = "all" ]; then
            echo 'variants=["9.1.24-SE","9.1.24-NSE","10.3.7-SE","10.3.7-NSE"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["${{ inputs.variant }}"]' >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.ksu }}" = "Both" ]; then
            echo 'ksu_check=["Include","Exclude"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ksu_check=["${{ inputs.ksu }}"]' >> "$GITHUB_OUTPUT"
          fi

          # "nogravity_defconfig, other_defconfig" -> ["nogravity_defconfig","other_defconfig"]
          defconfigs=$(echo "${{ inputs.defconfig }}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
          echo "defconfigs=${defconfigs}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-setup
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      matrix:
        variant: ${{ fromJson(needs.matrix-setup.outputs.variants) }}
        ksu: ${{ fromJson(needs.matrix-setup.outputs.ksu_check) }}
        defconfig: ${{ fromJson(needs.matrix-setup.outputs.defconfigs) }}
      fail-fast: false

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget \
            build-essential gcc make \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses5-dev \
            python3 \
            zip unzip \
            cpio \
            ccache \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            lld \
            rsync \
            clang

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Patch kernel tanpa ubah source
        run: |
          echo "Patch Polly..."
          grep -n "polly" Makefile
          sed -i 's/-mllvm -polly-opt-fusion=max/-mllvm -polly-loopfusion-greedy -mllvm -polly-isl-arg=--no-schedule-serialize-sccs/' Makefile
          grep -n "polly" Makefile

      - name: Download Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Git Clone AnyKernel3 (fork sendiri, sudah dikonfigurasi untuk beryllium)
        run: |
          git clone --depth=1 https://github.com/Shiki-ghub/AnyKernel3.git AnyKernel3

      - name: Build kernel
        run: |
          chmod +x ./compile-beryllium.sh
          bash ./compile-beryllium.sh \
            --variant "${{ matrix.variant }}" \
            --ksu "${{ matrix.ksu }}" \
            --defconfig "${{ matrix.defconfig }}" \
            --jobs "${{ inputs.jobs }}" \
            --clang-path "$HOME/toolchains/neutron-clang/bin"

      - name: Package into AnyKernel3 zip
        id: package
        run: |
          variant="${{ matrix.variant }}"
          ksu="${{ matrix.ksu }}"
          defconfig="${{ matrix.defconfig }}"

          cp "release/beryllium/Image-${variant}.gz-dtb" "AnyKernel3/Image.gz-dtb"

          if [ "$ksu" = "Include" ]; then
            ksu_tag="KSU"
          else
            ksu_tag="NoKSU"
          fi

          zipname="beryllium-${defconfig}-${variant}-${ksu_tag}-$(date +'%Y%m%d-%H%M').zip"
          (
            cd AnyKernel3 || exit 1
            zip -r9 "../${zipname}" . -x ".git/*" ".github/*" "README.md"
          )
          rm -f "AnyKernel3/Image.gz-dtb"

          echo "zipname=${zipname}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zipname }}
          path: ${{ steps.package.outputs.zipname }}
          if-no-files-found: error
          retention-days: 30
          
