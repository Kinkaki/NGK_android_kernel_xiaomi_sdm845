name: Github workflow kernel build

on:
  workflow_dispatch

env:
  BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git libssl-dev libncurses5-dev \
            liblz4-tool lz4 zip unzip python3

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"
          echo "COMPILERDIR=$HOME/proton-clang" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Shiki-ghub/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          echo "ANYKERNEL_DIR=$GITHUB_WORKSPACE/AnyKernel3" >> "$GITHUB_ENV"

      - name: Make build scripts executable
        run: chmod +x compile.sh compile-beryllium.sh compile-dipper.sh

      - name: Build kernel
        run: ./compile.sh

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-builds
          path: out/outputs/**/*-AnyKernel3.zip
          if-no-files-found: warn
