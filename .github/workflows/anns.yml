name: Build Kernel - NSE Only

on:
  workflow_dispatch:
    inputs:
      with_kernelsu:
        description: 'With KernelSU-Next? (Y/N)'
        required: true
        default: 'Y'
      phone:
        description: 'Device codename'
        required: true
        default: 'beryllium'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 58c0e7a618c8cc8220e32d23513201574e3324a5
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick \
            liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev \
            python2 python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git \
            $GITHUB_WORKSPACE/toolchains/proton-clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Shiki-ghub/AnyKernel3.git \
            $GITHUB_WORKSPACE/anykernel

      - name: Download build script
        run: |
          curl -fL \
            https://raw.githubusercontent.com/Shiki-ghub/Ajs/main/build.sh \
            -o build.sh
          chmod +x build.sh
          echo "✓ build.sh downloaded"

      - name: Setup KernelSU-Next & download patched files
        if: ${{ github.event.inputs.with_kernelsu == 'Y' || github.event.inputs.with_kernelsu == 'y' }}
        run: |
          echo "========================================"
          echo "  KernelSU-Next: ENABLED"
          echo "========================================"
          
          # Setup KernelSU-Next langsung (tidak download dulu)
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "✓ KernelSU-Next cloned"
          
          # Download file-file sudah di-patch dari repo kecil → overwrite
          for file in fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c; do
            filename=$(basename $file)
            curl -fL \
              https://raw.githubusercontent.com/Shiki-ghub/Ajs/main/${filename} \
              -o ${file}
            echo "✓ Overwritten: ${file}"
          done
          
          echo "KSU_ENABLED=Y" >> $GITHUB_ENV

      - name: Download defconfig
        run: |
          if [ "${{ github.event.inputs.with_kernelsu }}" = "Y" ] || [ "${{ github.event.inputs.with_kernelsu }}" = "y" ]; then
            DEFCONFIG="nogravityksun_defconfig"
          else
            DEFCONFIG="nogravity_defconfig"
          fi
          
          curl -fL \
            https://raw.githubusercontent.com/Shiki-ghub/Ajs/main/${DEFCONFIG} \
            -o arch/arm64/configs/${DEFCONFIG}
          
          if [ ! -f arch/arm64/configs/${DEFCONFIG} ]; then
            echo "❌ Failed to download defconfig: ${DEFCONFIG}"
            exit 1
          fi
          
          echo "✓ Defconfig: ${DEFCONFIG}"
          echo "DEFCONFIG=${DEFCONFIG}" >> $GITHUB_ENV

      - name: Run build
        run: |
          ./build.sh \
            "${{ env.DEFCONFIG }}" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/toolchains/proton-clang" \
            "$GITHUB_WORKSPACE/anykernel" \
            "${{ github.event.inputs.phone }}"
        env:
          LINKER: ld.lld
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-build
          KSU_ENABLED: ${{ env.KSU_ENABLED }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProtonKernel-${{ github.event.inputs.phone }}-NSE-${{ github.run_number }}
          path: |
            out/*.zip
            out/outputs/**/*
          if-no-files-found: warn
