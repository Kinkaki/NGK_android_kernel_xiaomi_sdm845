name: Build Kernel - NSE Only

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name'
        required: true
        default: 'nogravityksun_defconfig'
      phone:
        description: 'Device codename'
        required: true
        default: 'beryllium'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 58c0e7a618c8cc8220e32d23513201574e3324a5
          fetch-depth: 1

      - name: Download defconfig
        run: |
          curl -fL \
            https://raw.githubusercontent.com/Shiki-ghub/Ajs/main/${{ github.event.inputs.defconfig }} \
            -o arch/arm64/configs/${{ github.event.inputs.defconfig }}
          
          if [ ! -f arch/arm64/configs/${{ github.event.inputs.defconfig }} ]; then
            echo "❌ Failed to download defconfig"
            exit 1
          fi
          echo "✓ Defconfig downloaded: ${{ github.event.inputs.defconfig }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick \
            liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev \
            python2 python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git \
            $GITHUB_WORKSPACE/toolchains/proton-clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Shiki-ghub/AnyKernel3.git \
            $GITHUB_WORKSPACE/anykernel

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh \
            "${{ github.event.inputs.defconfig }}" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/toolchains/proton-clang" \
            "$GITHUB_WORKSPACE/anykernel" \
            "${{ github.event.inputs.phone }}"
        env:
          LINKER: ld.lld
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProtonKernel-${{ github.event.inputs.phone }}-NSE-${{ github.run_number }}
          path: |
            out/*.zip
            out/outputs/**/*
          if-no-files-found: warn
